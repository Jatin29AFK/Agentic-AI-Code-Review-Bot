services:
  - type: web
    name: agentic-ai-code-review-bot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    healthCheckPath: /health
    disk:
      name: review-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/reviews.db
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: POST_WEBHOOK_COMMENTS
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: AUTOFIX_ENABLED
        value: "true"
      - key: AUTOFIX_MAX_ISSUES_PER_REVIEW
        value: "3"
      - key: AUTOFIX_MIN_CONFIDENCE
        value: "0.85"
      - key: AUTOFIX_MAX_PATCH_CHARS
        value: "8000"
